[project]
name = "docintel-backend"
version = "1.0.0"
description = "AI-powered document intelligence: multi-format ingestion, OCR, invoice extraction, validation and search."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "python-multipart>=0.0.33",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "alembic>=1.20",
  "celery[redis]>=5.6",
  "redis>=8.1",
  "pymupdf>=2.1",
  "rapidocr>=3.10",
  "onnxruntime>=1.31",
  "pillow>=13.0",
  "numpy>=2.5",
  "opencv-python-headless>=5.0",
  "pytesseract>=0.3.13",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.2",
  "pandas>=3.1",
  "charset-normalizer>=3.5",
  "defusedxml>=0.7.1",
  "rapidfuzz>=3.14",
  "python-dateutil>=2.9",
  "fastembed>=0.9",
  "anthropic>=2.4",
  "google-genai>=2.34",
  "httpx>=0.28",
  "slowapi>=0.1.10",
  "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "pytest-asyncio>=1.4",
  "fakeredis>=2.40",
  "ruff>=0.17",
  "mypy>=2.4",
  "xlwt>=1.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running tests (large documents, full OCR runs)",
  "integration: needs PostgreSQL/Redis from docker compose (DATABASE_URL / REDIS_URL)",
  "live_llm: calls a real LLM endpoint (needs LLM_BASE_URL or an API key)",
]
filterwarnings = [
  "ignore::DeprecationWarning:xlrd.*",
  "ignore:.*xlrd engine is deprecated.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"eval/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
